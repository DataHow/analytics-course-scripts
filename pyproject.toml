[project]
name = "analytics-course-scripts"
version = "0.1.0"
description = "Notebooks for the Advanced Process Data Analytics Course for Bioprocessing (DataHow)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "plotly>=5.18",
    "matplotlib>=3.8",
    "pillow>=10",
    "bayesian-optimization==1.5.1",
    "jupyterlab>=4.1",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "nbconvert>=7.16",
]

[dependency-groups]
export = [
    "kaleido>=1.0",
    "playwright>=1.45",
]

[tool.uv]
package = false
